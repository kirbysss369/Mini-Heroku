services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_paas
      POSTGRES_USER: mini_paas
      POSTGRES_PASSWORD: mini_paas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_paas -d mini_paas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
